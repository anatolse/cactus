schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform
context: |
  Tech stack: C++23 compiler (src/common, src/frontend, src/backends), Cactus DSL
  (stdlib/, examples/), Catch2 for tests.
  TDD is required for all new code: write a failing test first, then implement.
  DSL/stdlib semantics and grammar are normative in
  openspec/specs/language-philosophy/spec.md and spec/cactus_dsl_spec.md; day-to-day
  coding conventions and priorities are in CLAUDE.md.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours
rules:
  tasks:
    - >-
      End every tasks.md with a final task that runs the coverage gate
      (`cmake --preset clang-coverage` then
      `cmake --build --preset clang-coverage --target coverage_check`). If it
      fails, add test cases for the uncovered lines until it passes; never lower
      CACTUS_COVERAGE_THRESHOLD.
